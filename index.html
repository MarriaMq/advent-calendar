<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Advent Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Всё построено в единицах макета: ширина макета = 1080.
     --k  — 1 единица макета в пикселях для ленты,
     --kt — то же для закреплённой шапки (может быть чуть меньше, чтобы шапка была не выше трети экрана). */
  :root{
    --bg:#b0c0d0;          /* фон */
    --pill:#d0dde9;        /* кнопки «открыть» и «зайти в клуб» */
    --grey:#626060;        /* текст закрытых дней */
    --white:#ffffff;       /* текст открытых дней, шапка, подзаголовок */
    --ink:#1b1b1b;         /* заголовок new ((conten advent)) calendar и текст кнопки клуба */
    --k:.3611px; --kt:.3611px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* страница сама не прокручивается и не оттягивается — прокручивается только лента */
  html,body{background:var(--bg);color:var(--ink);height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- закреплённая шапка ---------- */
  .top{
    position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);
    padding-top:env(safe-area-inset-top,0px);
  }
  .top-in{position:relative;width:calc(var(--kt) * 1080);height:calc(var(--kt) * 612);margin:0 auto}
  .head span{
    position:absolute;top:calc(var(--kt) * 24);
    font-size:calc(var(--kt) * 24.5);line-height:1;letter-spacing:-.02em;white-space:nowrap;color:var(--white);
  }
  .head span:nth-child(1){left:calc(var(--kt) * 57)}
  .head span:nth-child(2){left:calc(var(--kt) * 338)}
  .head span:nth-child(3){left:calc(var(--kt) * 516)}
  .head span:nth-child(4){right:calc(var(--kt) * 50)}
  .hero{
    position:absolute;left:calc(var(--kt) * 45);top:calc(var(--kt) * 134);
    font-weight:400;font-size:calc(var(--kt) * 102.7);letter-spacing:-.02em;line-height:.68;color:var(--ink);
    transform:scaleY(1.22);transform-origin:0 0;
  }
  .hero span{display:block;white-space:nowrap}
  .hero .ind{padding-left:.54em}
  .tagline{
    position:absolute;left:calc(var(--kt) * 476);top:calc(var(--kt) * 414);
    font-size:calc(var(--kt) * 39.5);line-height:.89;letter-spacing:-.02em;color:var(--white);
    transform:scaleY(1.17);transform-origin:0 0;   /* вытянутые буквы, как в макете */
  }
  .tagline span{display:block;white-space:nowrap}

  /* ---------- лента ---------- */
  .list{
    position:fixed;inset:0;z-index:1;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:none;            /* без «резинки» */
    scrollbar-width:none;
  }
  .list::-webkit-scrollbar{display:none}
  .canvas{position:relative;width:calc(var(--k) * 1080);margin:0 auto}
  .day{position:absolute;left:0;width:100%}
  .week{
    position:absolute;left:calc(var(--k) * 47);top:calc(var(--k) * -2);
    font-size:calc(var(--k) * 42.4);line-height:1;letter-spacing:-.02em;color:var(--white);white-space:nowrap;
  }
  .txt{
    position:absolute;right:calc(var(--k) * 621);top:0;   /* правый край колонки = 459 */
    text-align:right;color:var(--grey);letter-spacing:-.02em;
    opacity:0;transition:opacity .9s ease .15s;
  }
  .day.in .txt{opacity:1}
  .day.is-open .txt{color:var(--white)}
  /* узкий вытянутый гротеск: Helvetica, растянутая по вертикали */
  .txt .t{display:block;white-space:pre;transform:scaleY(1.2);transform-origin:100% 0;line-height:.76}
  .txt .main span{display:block;white-space:pre;line-height:.915}
  .txt .date{font-size:calc(var(--k) * 27)}
  .txt .main{margin-top:calc(var(--k) * 35);font-size:calc(var(--k) * 25.5)}
  .txt .ttl{text-transform:uppercase}
  .txt .main{line-height:.915}
  .open-btn{
    position:absolute;right:calc(var(--k) * 616);
    width:calc(var(--k) * 249);height:calc(var(--k) * 39);
    border:1px solid var(--white);border-radius:999px;background:var(--pill);
    color:var(--white);font-weight:700;font-size:calc(var(--k) * 26);letter-spacing:0;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0 0 .16em;text-align:center;   /* строчные буквы — оптически по центру */
    -webkit-tap-highlight-color:transparent;outline:none;
  }
  .open-btn:active{filter:brightness(.96)}
  .open-btn:focus-visible{outline:1px dashed var(--white);outline-offset:3px}

  .ph{
    position:absolute;left:calc(var(--k) * 477);top:0;display:block;overflow:hidden;
    outline:none;-webkit-tap-highlight-color:transparent;background:#9fb0c1;
  }
  .ph:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
  /* параллакс: картинка чуть выше рамки и плавно ездит внутри неё при прокрутке */
  .ph .pl{position:absolute;left:0;right:0;top:-7%;height:114%;will-change:transform}
  .ph img{
    display:block;width:100%;height:100%;object-fit:cover;
    transform:scale(1.12);filter:blur(5px);
    transition:transform 1.4s cubic-bezier(.2,.7,.2,1), filter 1s ease;
  }
  .day.in .ph img{transform:none;filter:none}
  .ph::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease}
  .ph.tap::after{opacity:.22;transition:none}
  /* замок на закрытых днях */
  .lock{
    position:absolute;left:0;right:0;top:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;gap:calc(var(--k) * 17);
    color:var(--white);text-align:center;pointer-events:none;
  }
  .lock svg{width:calc(var(--k) * 61);height:calc(var(--k) * 72)}
  .lock span{font-size:calc(var(--k) * 26);line-height:.78;letter-spacing:-.02em;white-space:pre;transform:scaleY(1.2);transform-origin:50% 0}
  .day.nudge .lock svg{animation:nudge .45s ease}
  @keyframes nudge{20%{transform:translateX(-6px) rotate(-6deg)}45%{transform:translateX(5px) rotate(5deg)}70%{transform:translateX(-3px)}}

  .flake{position:absolute;z-index:2;pointer-events:none;background:url(images/flake.webp) center/contain no-repeat;
    animation:twinkle 5s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes twinkle{0%,100%{opacity:1;transform:rotate(0) scale(1)}50%{opacity:.6;transform:rotate(14deg) scale(.92)}}

  .toast{
    position:fixed;left:50%;bottom:calc(var(--k) * 210 + env(safe-area-inset-bottom,0px));z-index:36;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:9px 16px;border-radius:999px;background:rgba(27,27,27,.72);color:var(--white);
    font-size:13px;white-space:nowrap;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- плавающая кнопка клуба ---------- */
  .club{
    position:fixed;left:50%;z-index:35;
    bottom:calc(var(--k) * 70 + env(safe-area-inset-bottom,0px));
    width:calc(var(--k) * 524);height:calc(var(--k) * 82);min-height:40px;
    transform:translateX(-50%);
    transition:transform .35s ease, opacity .3s ease;
  }
  .club a{
    display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    border:1px solid var(--white);border-radius:999px;background:var(--pill);
    color:var(--ink);text-decoration:none;font-size:calc(var(--k) * 40.2);letter-spacing:-.02em;
  }
  .club a span{display:inline-block;transform:scaleY(1.1)}
  .club a:active{filter:brightness(.96)}
  .club.pulse a{animation:pulse .9s ease}
  @keyframes pulse{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
  .open .club{transform:translate(-50%,200%);opacity:0}

  /* ---------- шторка урока ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(27,27,27,.4);opacity:0;pointer-events:none;transition:opacity .35s ease}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
    --paper:#f4f2ee;--ink:#1b1b1b;--muted:rgba(27,27,27,.55);--line:rgba(27,27,27,.14);
    --surface:rgba(27,27,27,.06);--surface-press:rgba(27,27,27,.11);
    background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;
    padding:10px 16px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px;padding-right:44px}
  .sheet h2{font-size:30px;line-height:1;letter-spacing:-.03em;font-weight:400;text-transform:uppercase;margin-bottom:14px}
  .sheet .cover{width:100%;max-height:300px;object-fit:cover;display:block;margin:0 0 18px}
  .sheet p{font-size:15px;line-height:1.5;margin-bottom:14px}
  .sheet h3{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
  .tag{display:inline-block;font-size:12px;letter-spacing:.02em;margin-bottom:10px}
  .tag::before{content:"//"}
  .steps{list-style:none;counter-reset:s;margin-bottom:14px}
  .steps li{counter-increment:s;position:relative;padding:12px 0 12px 40px;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
  .steps li:last-child{border-bottom:1px solid var(--line)}
  .steps li::before{content:"(" counter(s,decimal-leading-zero) ")";position:absolute;left:0;top:13px;font-size:11px;font-style:italic;color:var(--muted)}
  .row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;margin-bottom:8px;border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
  .row:active{background:var(--surface-press)}
  .row .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:15px}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-weight:500;font-size:14px;line-height:1.25}
  .row .tx small{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .go{flex:none;font-size:16px;color:var(--muted)}
  .video{position:relative;aspect-ratio:16/9;background:rgba(27,27,27,.08);margin:6px 0 16px;overflow:hidden}
  .video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video .vph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .close{
    position:sticky;top:0;float:right;margin-top:-4px;background:var(--ink);color:var(--paper);
    width:32px;height:32px;border-radius:50%;font-size:16px;line-height:32px;
    outline:none;-webkit-tap-highlight-color:transparent;
  }
  .close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .sheet,.flake,.txt,.ph img{transition:none;animation:none}
    .txt{opacity:1}.ph img{transform:none;filter:none}
  }
</style>
</head>

<script>
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== 'unknown');
function haptic(kind, type){
  try { const h = IN_TG && TG.HapticFeedback; if (!h) return;
    kind === 'notify' ? h.notificationOccurred(type) : h.impactOccurred(type); } catch(_){}
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD = ['вс.','пн.','вт.','ср.','чт.','пт.','сб.'];
const dateOf = i => { const d = new Date(START); d.setDate(START.getDate() + i); return d; };
const dd = d => String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
const LOCK_SVG = `<svg viewBox="0 0 64 76" fill="none" stroke="currentColor" stroke-width="4.5" aria-hidden="true">
  <path d="M15 33V22a17 17 0 0 1 34 0v11"/><rect x="5" y="33" width="54" height="40" rx="5"/>
  <circle cx="32" cy="50" r="4.5" fill="currentColor" stroke="none"/><path d="M32 52v9"/></svg>`;

const list = document.getElementById('list'), canvas = document.getElementById('canvas');
const u = v => `calc(var(--k) * ${v})`;
const lastBottom = BOX[BOX.length-1][0] + BOX[BOX.length-1][2];
const END = lastBottom + 112 + 82 + 70;                 // зазор до кнопки клуба + кнопка + её отступ снизу
canvas.style.height = u(END - LIST_TOP);
const Y = y => u(y - LIST_TOP);

canvas.innerHTML = DAYS.map((d, i) => {
  const [top, w, h] = BOX[i], dt = dateOf(i);
  return `<section class="day ${d.open ? 'is-open' : 'is-locked'}" data-i="${i}" style="top:${Y(top)}">
    ${d.week ? `<div class="week" style="top:${u(OFF[i] - 5)}">неделя((${d.week}))</div>` : ''}
    <div class="txt" style="top:${u(OFF[i] - 3)}">
      <span class="t date">((${dd(dt)}))\n${WD[dt.getDay()]}</span>
      <span class="t main"><span class="ttl">${esc(d.title)}</span><span class="desc">${esc(d.desc)}</span></span>
    </div>
    ${d.open ? `<button class="open-btn" data-open data-top="${BT[i + 1]}">${esc(d.btn || 'открыть')}</button>` : ''}
    <button class="ph" style="width:${u(w)};height:calc(var(--k) * ${h} + 1px)" aria-label="${esc(d.title.replace(/\n/g,' '))}${d.open ? '' : ' — доступно в клубе'}">
      <span class="pl"><img src="photos/${String(i+1).padStart(2,'0')}.webp" alt="" decoding="async"></span>
      ${d.open ? '' : `<span class="lock" style="top:${u(LT[i + 1] ?? 100)}">${LOCK_SVG}<span>((материал доступен\nтолько в клубе))</span></span>`}
    </button>
  </section>`;
}).join('') + FLAKES.map(([x, y, s], k) =>
  `<span class="flake" style="left:${u(x - s/2)};top:${Y(y - s*.485)};width:${u(s)};height:${u(s*.97)};--d:${-(k % 7) * .8}s"></span>`
).join('');

/* кнопка «открыть» — сразу под описанием, на 19 единиц ниже последней строки */
/* кнопки ставим ровно в целые пиксели экрана — тогда тонкая рамка видна одинаково сверху и снизу */
function placeButtons(){
  const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k'));
  const dpr = devicePixelRatio || 1, snap = v => Math.round(v * dpr) / dpr;
  document.querySelectorAll('.open-btn').forEach(b => {
    b.style.top = snap(+b.dataset.top * k) + 'px';
    b.style.height = snap(37 * k) + 'px';
  });
  const club = document.getElementById('club');
  club.style.height = Math.max(40, snap(82 * k)) + 'px';
}

/* масштаб от ширины экрана; шапка — не выше трети экрана */
function fit(){
  const W = Math.min(innerWidth, 560);
  const k = W / 1080;
  const kt = Math.min(k, (innerHeight / 3) / TOP_H);
  const root = document.documentElement.style;
  root.setProperty('--k', k + 'px');
  root.setProperty('--kt', kt + 'px');
  const topH = document.getElementById('top').offsetHeight;
  canvas.style.marginTop = (topH - 0) + 'px';
  canvas.style.height = `calc(var(--k) * ${END - LIST_TOP})`;
  placeButtons();
  parallax();
}

/* ---------- появление: фото наводятся на резкость ---------- */
let queue = 0;
function reveal(day, stagger){
  const img = day.querySelector('img');
  let done = false;
  const go = () => { if (done) return; done = true;
    setTimeout(() => day.classList.add('in'), stagger ? 250 + queue++ * 220 : 0); };
  (img.decode ? img.decode() : Promise.resolve()).then(go, go);
  setTimeout(go, 1000);
}
let pending = [...document.querySelectorAll('.day')];
function check(stagger){
  const edge = innerHeight * .9;
  pending = pending.filter(d => {
    if (d.getBoundingClientRect().top < edge) { reveal(d, stagger); return false; }
    return true;
  });
}

/* ---------- параллакс внутри рамок ---------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pls = [...document.querySelectorAll('.ph .pl')];
let ticking = false;
function parallax(){
  ticking = false;
  if (reduce) return;
  const vh = innerHeight;
  for (const p of pls) {
    const r = p.parentElement.getBoundingClientRect();
    if (r.bottom < -50 || r.top > vh + 50) continue;
    const c = (r.top + r.height / 2 - vh / 2) / vh;          // -1…1 от центра экрана
    p.style.transform = `translate3d(0,${(-c * r.height * .06).toFixed(1)}px,0)`;
  }
}
list.addEventListener('scroll', () => {
  check(false);
  if (!ticking) { ticking = true; requestAnimationFrame(parallax); }
}, {passive:true});
addEventListener('resize', fit);
document.fonts && document.fonts.ready.then(placeButtons);
fit();
check(true);

/* ---------- нажатия ---------- */
let toastT;
function lockedTap(day){
  haptic('notify','warning');
  day.classList.remove('nudge'); void day.offsetWidth; day.classList.add('nudge');
  const t = document.getElementById('toast');
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  const club = document.getElementById('club');
  club.classList.remove('pulse'); void club.offsetWidth; club.classList.add('pulse');
}
canvas.addEventListener('click', e => {
  const hit = e.target.closest('.ph, [data-open]'); if (!hit) return;
  const day = hit.closest('.day'), i = +day.dataset.i;
  if (day.classList.contains('is-locked')) return lockedTap(day);
  const ph = day.querySelector('.ph');
  ph.classList.add('tap'); requestAnimationFrame(() => requestAnimationFrame(() => ph.classList.remove('tap')));
  haptic('impact','medium');
  openDay(i);
});

/* ---------- шторка ---------- */
const sheet = document.getElementById('sheet'), closeBtn = document.getElementById('closeBtn');
function videoHTML(src){
  if (!src) return `<div class="video"><div class="vph">здесь будет видео</div></div>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(src)) return `<div class="video"><video src="${esc(src)}" controls playsinline preload="metadata"></video></div>`;
  return `<div class="video"><iframe src="${esc(src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}
function blockHTML(b){
  if ('video' in b) return videoHTML(b.video);
  if (b.heading)    return `<h3>${esc(b.heading)}</h3>`;
  if (b.text)       return b.text.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
  if (b.steps)      return `<ol class="steps">${b.steps.map(s => `<li>${esc(typeof s === 'string' ? s : s.text)}</li>`).join('')}</ol>`;
  if (b.file)       return `<a class="row" href="${esc(b.file)}" download><span class="ic" aria-hidden="true">↓</span>
                       <span class="tx"><b>${esc(b.name || 'Скачать файл')}</b><small>${esc(b.size || '')}</small></span></a>`;
  if (b.link)       return `<a class="row" href="${esc(b.link)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">↗</span>
                       <span class="tx"><b>${esc(b.name || b.link)}</b><small>${esc(b.note || new URL(b.link).hostname)}</small></span><span class="go" aria-hidden="true">›</span></a>`;
  return '';
}
let lastEl = null, usingKeyboard = false;
addEventListener('keydown', e => { if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ') usingKeyboard = true; if (e.key === 'Escape') closeDay(); });
addEventListener('pointerdown', () => usingKeyboard = false, true);
function openDay(i){
  const d = DAYS[i], dt = dateOf(i);
  lastEl = document.activeElement;
  sNum.textContent = `((${dd(dt)})) ${WD[dt.getDay()]}`;
  sDate.textContent = dt.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  sTag.textContent = d.tag || ''; sTag.hidden = !d.tag;
  sTitle.textContent = d.title.replace(/\n/g,' ');
  sImg.src = `photos/${String(i+1).padStart(2,'0')}.webp`; sImg.alt = '';
  sBody.innerHTML = (d.blocks || [{ text: d.desc.replace(/\n/g,' ') }, { video:'' }]).map(blockHTML).join('');
  sheet.scrollTop = 0;
  document.body.classList.add('open');
  list.style.overflowY = 'hidden';
  if (usingKeyboard) closeBtn.focus({preventScroll:true});
}
function closeDay(){
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open');
  list.style.overflowY = '';
  sBody.innerHTML = '';
  if (lastEl && lastEl.blur) usingKeyboard ? lastEl.focus({preventScroll:true}) : lastEl.blur();
}
closeBtn.onclick = closeDay;
scrim.onclick = closeDay;
let sy = null;
sheet.addEventListener('touchstart', e => { sy = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if (sy === null) return; const dy = e.touches[0].clientY - sy;
  if (dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
}, {passive:true});
sheet.addEventListener('touchend', e => {
  if (sy === null) return; const dy = e.changedTouches[0].clientY - sy;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 110) closeDay(); sy = null;
});
</script>
<script>
/* Telegram: на весь экран, без закрытия свайпом, цвета под макет */
(function(){
  if (!IN_TG) return;
  try {
    TG.ready(); TG.expand();
    TG.disableVerticalSwipes && TG.disableVerticalSwipes();
    TG.setHeaderColor && TG.setHeaderColor('#b0c0d0');
    TG.setBackgroundColor && TG.setBackgroundColor('#b0c0d0');
    TG.setBottomBarColor && TG.setBottomBarColor('#b0c0d0');
  } catch(e) {}
})();
/* кнопка клуба — ССЫЛКА НА БОТА: */
const CLUB_URL = "https://t.me/newcontentdump_bot?start=";
(function(){
  const btn = document.getElementById('clubBtn');
  btn.href = CLUB_URL;
  btn.addEventListener('click', e => {
    if (IN_TG && TG.openTelegramLink && /^https:\/\/t\.me\//.test(CLUB_URL)) {
      e.preventDefault();
      haptic('impact','medium');
      TG.openTelegramLink(CLUB_URL);
      setTimeout(() => { try { TG.close(); } catch(_){} }, 300);
    }
  });
})();
</script>
