<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Advent Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#550d10;                       /* бордовый фон */
    --ink:#ffffff;                      /* чисто белый текст */
    --muted:rgba(255,255,255,.62);      /* второстепенный текст */
    --line:rgba(255,255,255,.18);       /* тонкие линии */
    --surface:rgba(255,255,255,.09);    /* плашки файлов и ссылок */
    --surface-press:rgba(255,255,255,.16);
    --blur:3px;          /* сила размытия неактивных карточек */
    --tilt:20;           /* макс. наклон в градусах */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body.locked{overflow:hidden}

  /* ---------- шапка и обложка (по макету) ---------- */
  /* шапка: одна строка, закреплена сверху */
  .head{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;
    font-size:clamp(8.5px,2.45vw,12px);line-height:1;letter-spacing:-.01em;white-space:nowrap;
    background:var(--bg);
  }
  /* узкий высокий гротеск: обычный Helvetica, вытянутый по вертикали */
  .hero{
    padding:12px 16px 0;margin:0;
    font-weight:400;font-size:min(10vw,72px);   /* точный размер подгоняет скрипт fitIntro() под ширину экрана */
    letter-spacing:-.035em;line-height:.8;
  }
  .hero span{display:block;width:max-content;padding-top:.42em;transform:scaleY(1.55);transform-origin:0 100%;white-space:nowrap}
  .hero .ind{padding-left:.58em}            /* «new» и «calendar» встают после «((» */
  /* подзаголовок начинается там, где кончается «r» в calendar — отступ ставит fitIntro() */
  .tagline{
    margin:10px 16px 30px var(--tag-x,36%);
    font-size:16px;letter-spacing:-.025em;line-height:.82;
  }
  .tagline span{display:block;width:max-content;padding-top:.3em;transform:scaleY(1.4);transform-origin:0 100%;white-space:nowrap}


  /* ---------- поле с карточками: свободный коллаж ---------- */
  .field{position:relative;margin:0 16px;min-height:100vh}
  /* без синей рамки фокуса от касаний; при управлении с клавиатуры — аккуратная пунктирная */
  .card, .close{outline:none;-webkit-tap-highlight-color:transparent}
  .card:focus-visible{outline:1px dashed var(--muted);outline-offset:6px}
  .close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .card{
    position:absolute;left:0;top:0;
    width:var(--w);
    z-index:var(--z,1);
    perspective:700px;
    border:0;background:none;text-align:left;color:inherit;font:inherit;padding:0;
    cursor:pointer;
    touch-action:manipulation;
  }
  .label{
    display:flex;gap:8px;align-items:baseline;
    font-size:10px;letter-spacing:.02em;margin-bottom:6px;
    height:12px;white-space:nowrap;
  }
  .label .num{font-style:normal}
  .label .ttl{
    opacity:0;transform:translateX(-4px);
    transition:opacity .35s ease,transform .35s ease;
  }
  .plx{will-change:transform;transform-origin:50% 60%}
  /* появление при прокрутке: выплывает снизу, разворачивается и проявляется */
  .rev{
    opacity:0;
    transform:translateY(70px) scale(.82) rotate(var(--rin,-8deg));
    transition:opacity .9s ease, transform 1.2s cubic-bezier(.16,1,.3,1);
  }
  .card.in .rev{opacity:1;transform:none}
  /* размытие висит на контейнере вместе с наклоном — так Safari рисует его надёжно */
  .tilt{
    filter:blur(var(--b,3px));
    transition:transform .7s cubic-bezier(.2,.8,.2,1), filter .6s ease;
    will-change:transform;
  }
  /* картинки — вырезанные объекты на прозрачном фоне, поэтому без обрезки.
     дальние (маленькие) размыты сильнее — эффект глубины */
  .tilt img{
    display:block;width:100%;height:auto;
    user-select:none;-webkit-user-drag:none;pointer-events:none;
  }

  /* подпись под картинкой на главном экране (поле caption у дня) */
  .cap{margin-top:10px;font-size:12px;line-height:1.35;color:var(--ink);max-width:30ch;text-wrap:pretty}
  /* текст поверх картинки, как в макете: от левого верхнего угла, выходит за край картинки */
  .cap-over{
    position:absolute;left:14%;top:16%;width:118%;pointer-events:none;
    color:var(--ink);letter-spacing:-.025em;
    transform:scaleY(1.35);transform-origin:0 0;
    text-shadow:0 0 2px rgba(85,13,16,.9), 0 0 8px rgba(85,13,16,.8), 0 0 18px rgba(85,13,16,.6);   /* белое читается и на белой картинке */
  }
  .cap-over b{display:block;font-weight:400;text-transform:uppercase;font-size:11px;line-height:1;margin-bottom:8px}
  .cap-over p{font-size:10.5px;line-height:.92;text-wrap:pretty}
  /* текст поверх картинки: не размывается вместе с ней и не мешает нажатию */
  .media{position:relative}
  .cap-on{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    margin:0;width:70%;max-width:none;text-align:center;
    font-size:13px;font-weight:600;line-height:1.25;letter-spacing:-.01em;
    color:var(--bg);pointer-events:none;
  }

  /* слова-декор на фоне, как на обложке */
  .word{
    position:absolute;left:0;top:0;z-index:0;pointer-events:none;
    color:var(--muted);white-space:nowrap;will-change:transform;
    font-size:var(--fs,13px);letter-spacing:-.01em;
  }
  .intro{will-change:transform,opacity}   /* заголовок и подпись под ним двигаются одним блоком */

  /* активная карточка: резкость + наклон + подпись */
  .card.is-active{z-index:30}
  /* нажали на открытый урок: он выходит вперёд, остальные уходят в тень */
  body.focus .card.in:not(.is-active) .rev{opacity:.22;transition:opacity .4s ease}
  body.focus .word, body.focus .intro{opacity:.25 !important;transition:opacity .4s ease}
  /* без drop-shadow: в Safari/Telegram на iPhone тень-фильтр + 3D-наклон рисуют белый прямоугольник */
  .card.is-active .tilt{filter:blur(0px)}
  .card.is-active .label .num{font-style:italic}
  .card.is-active .label .ttl{opacity:1;transform:none}

  /* закрытые (будущие) дни */
  /* закрытые дни — «в клубе»: размытые, полупрозрачные */
  .card.is-locked .tilt{opacity:.7}
  .card.is-locked .label{color:var(--muted)}
  .card.is-locked .label .ttl{display:none}
  .card.is-locked .label::after{content:"в клубе";color:var(--muted)}
  .card.nudge .rev{animation:nudge .45s ease}
  @keyframes nudge{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}
  .toast{
    position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:36;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.55);color:var(--ink);
    font-size:13px;white-space:nowrap;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .club.pulse a{animation:pulse .9s ease}
  @keyframes pulse{30%{transform:scale(1.04)}60%{transform:scale(.99)}}

  /* ---------- шторка с содержимым дня ---------- */
  .scrim{
    position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .35s ease;
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
    /* шторка урока — тёплый молочный, внутри свои цвета под светлый фон */
    --paper:#f3eee7;
    --ink:#3a0b0e;
    --muted:rgba(58,11,14,.55);
    --line:rgba(58,11,14,.14);
    --surface:rgba(58,11,14,.06);
    --surface-press:rgba(58,11,14,.11);
    background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;
    padding:10px 16px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px;padding-right:44px}
  .sheet h2{font-size:30px;line-height:1;letter-spacing:-.03em;font-weight:700;margin-bottom:14px}
  /* белая игрушка на светлом фоне: чуть притемняем и даём тень, чтобы читалась */
  .sheet .cover{width:62%;max-height:260px;object-fit:contain;display:block;margin:0 auto 18px;
    filter:brightness(.88) contrast(1.08) drop-shadow(0 10px 18px rgba(58,11,14,.22))}
  .sheet p{font-size:15px;line-height:1.5;margin-bottom:14px}
  .sheet h3{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
  .tag{display:inline-block;font-size:12px;letter-spacing:.02em;margin-bottom:10px}
  .tag::before{content:"//"}

  /* туториал: пронумерованные шаги */
  .steps{list-style:none;counter-reset:s;margin-bottom:14px}
  .steps li{counter-increment:s;position:relative;padding:12px 0 12px 40px;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
  .steps li:last-child{border-bottom:1px solid var(--line)}
  .steps li::before{content:"(" counter(s,decimal-leading-zero) ")";position:absolute;left:0;top:13px;font-size:11px;font-style:italic;color:var(--muted)}
  .steps img{display:block;width:100%;margin-top:10px}

  /* файл и ссылки — строки во всю ширину, удобно нажимать пальцем */
  .row{
    display:flex;align-items:center;gap:12px;min-height:56px;
    padding:10px 14px;margin-bottom:8px;border-radius:12px;
    background:var(--surface);color:var(--ink);text-decoration:none;
  }
  .row:active{background:var(--surface-press)}
  .row .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper,#fff);display:grid;place-items:center;font-size:15px}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-weight:500;font-size:14px;line-height:1.25}
  .row .tx small{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .go{flex:none;font-size:16px;color:var(--muted)}
  .video{position:relative;aspect-ratio:16/9;background:rgba(0,0,0,.35);margin:6px 0 16px;overflow:hidden}
  .video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .close{
    position:sticky;top:0;float:right;margin-top:-4px;
    border:0;background:var(--ink);color:var(--paper,#fff);
    width:32px;height:32px;border-radius:50%;font-size:16px;line-height:32px;cursor:pointer;
  }

  /* ---------- закреплённая кнопка клуба ---------- */
  .club{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(transparent, var(--bg) 45%);
    pointer-events:none;transition:opacity .3s ease, transform .3s ease;
  }
  .club a{
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    height:52px;border-radius:999px;
    background:var(--ink);color:var(--bg);text-decoration:none;
    font-size:17px;font-weight:400;letter-spacing:-.03em;
  }
  /* тот же узкий вытянутый шрифт, что в заголовке и подзаголовке */
  .club a span{display:inline-block;transform:scaleY(1.38)}
  .club a:active{transform:scale(.98)}
  .club a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .open .club{opacity:0;transform:translateY(20px);pointer-events:none}   /* прячем, пока открыт день */
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

  /* слабые Android: размытие легче, появление быстрее */
  .lite .card.is-locked .tilt{filter:blur(2px)}
  .lite .rev{transition:opacity .5s ease, transform .6s ease}

  @media (prefers-reduced-motion:reduce){
    .tilt,.sheet,.tilt img,.rev{transition:none}
    .rev{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="head">
  <span>ne(w) content dump</span>
  <span>2027</span>
  <span>content advent calendar</span>
  <span>by dasha.brisaniuk</span>
</header>
<div class="intro">
<h1 class="hero">
  <span class="ind">new</span>
  <span>((content advent))</span>

</h1>
<p class="tagline">
  <span>заходим в 2027</span>

  <span>продает</span>
</p>

<main class="field" id="field"></main>

<div class="scrim" id="scrim"></div>
<article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">

  <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
  <div class="meta"><span id="sNum"></span><span id="sDate"></span></div>

  <h2 id="sTitle"></h2>
  <img id="sImg" class="cover" alt="">
  <div id="sBody"></div>
</article>

<script>
/* подгоняем обложку под ширину экрана:
   1) заголовок — чтобы «((content advent))» занимал всю ширину;
   2) подзаголовок — начинается ровно у конца «r» в calendar и помещается в остаток строки */
function fitIntro(){
  const hero = document.querySelector('.hero'), tag = document.querySelector('.tagline');
  if (!hero || !tag) return;
  const intro = hero.parentElement, W = intro.clientWidth, pad = 16;
  const lines = [...hero.querySelectorAll('span')], tlines = [...tag.querySelectorAll('span')];
  const TARGET_H = innerHeight / 3;               // заголовок + подзаголовок ≈ треть высоты экрана

  const place = fs => {
    hero.style.fontSize = fs + 'px';
    const widest = Math.max(...lines.map(l => l.offsetWidth));
    // на широком экране блок по центру, на телефоне — от левого края
    const left = W >= 600 ? Math.max(pad, (W - widest) / 2) : pad;
    hero.style.paddingLeft = left + 'px';
    const x = lines[lines.length - 1].getBoundingClientRect().right - intro.getBoundingClientRect().left;
    intro.style.setProperty('--tag-x', x + 'px');
    tag.style.fontSize = '16px';
    const tw = Math.max(...tlines.map(l => l.offsetWidth));
    const room = Math.min(W - x - pad, left + widest - x + widest * .35);
    tag.style.fontSize = Math.max(9, Math.min(22, 16 * room / tw)) + 'px';
    const top = lines[0].getBoundingClientRect().top - lines[0].offsetHeight * .55;   // с учётом вытянутых букв
    return { widest, h: tlines[tlines.length - 1].getBoundingClientRect().bottom - top };
  };

  hero.style.fontSize = ''; hero.style.paddingLeft = '';
  const base = parseFloat(getComputedStyle(hero).fontSize);
  const w0 = place(base).widest;
  let fs = Math.min(base * (W * .68) / w0, 96);          // «((content advent))» ≈ 68% ширины, как в макете
  for (let k = 0; k < 3; k++) {                        // и не выше трети экрана
    const m = place(fs);
    if (m.h <= TARGET_H * 1.04) break;
    fs *= TARGET_H / m.h;
  }
  place(fs);
}
fitIntro();
addEventListener('resize', fitIntro);
document.fonts && document.fonts.ready.then(fitIntro);
</script>
<script>
/* =========================================================
   ДАННЫЕ: сюда вписываешь каждый день.
   title  – название (появляется рядом с номером)
   tag    – формат дня: «видео», «туториал», «файл», «статья»… (любой текст)
   caption– (необязательно) подпись на главном экране
   captionTitle – (необязательно) заголовок подписи, например «задание 1»
   captionPlace – "over" = текст поверх картинки от левого верхнего угла (как в макете),
                  "center" = поверх по центру; без него — под картинкой
   img    – картинка карточки (лучше PNG без фона)
   blocks – содержимое шторки, в любом порядке и количестве:
     { text:  "абзац" }                       – текст (можно несколько абзацев через \n\n)
     { video: "https://…/embed/…" | "x.mp4" } – видео YouTube / Vimeo / файл; "" = заглушка
     { steps: ["шаг 1", "шаг 2", …] }          – туториал по шагам
       шаг может быть объектом { text:"…", img:"images/…" }
     { file:  "files/x.pdf", name:"…", size:"2 МБ" } – файл на скачивание
     { link:  "https://…", name:"…", note:"…" }      – ссылка на статью/сайт
     { heading: "заголовок раздела" }
   ========================================================= */
const DAYS = [
  { title:"синнабон-контент", tag:"видео", img:"images/angel.webp",
    captionTitle:"задание 1",
    caption:"создаем рилс на повышение ЛОЯЛЬНОСТИ (даем пользу или свой жизненный опыт)",
    captionPlace:"over",
    blocks:[
      { text:"Как снимать «вкусный» контент на телефон: свет, ракурс и 3 кадра, которые продают." },
      { video:"" },
      ]},
  { title:"селфи-формат", tag:"туториал", img:"images/ornament-white.webp", blocks:[
      { text:"Пошаговый разбор: как сделать селфи-видео, которое досматривают до конца." },
      { steps:[
          "Поставь телефон на уровне глаз, камера — по центру лица.",
          "Первые 2 секунды — сразу к сути, без «привет, ребята».",
          "Сними 3 дубля и выбери самый живой, а не самый ровный.",
          "Добавь субтитры: 80% смотрят без звука." ]} ]},
  { title:"диско-шаблоны", tag:"файл", img:"images/disco-white.webp", blocks:[
      { text:"Набор шаблонов для сторис в стиле коллажа. Открываются в Canva, всё редактируется." },
      { file:"files/templates.zip", name:"Шаблоны сторис — 12 шт.", size:"ZIP · 8 МБ" },
      { file:"files/guide.pdf", name:"Гайд: как пользоваться", size:"PDF · 1,2 МБ" } ]},
  { title:"контраст", tag:"статья", img:"images/cherry-white.webp", blocks:[
      { text:"Почему ч/б-графика снова в трендах и как её использовать в ленте. Собрала лучшие материалы по теме." },
      { heading:"почитать" },
      { link:"https://example.com/article-1", name:"Монохром в айдентике 2026", note:"статья · 7 мин" },
      { link:"https://example.com/article-2", name:"Как сделать stencil-эффект в Photoshop", note:"туториал · 5 мин" } ]},
  { title:"стикеры", tag:"видео + файл", img:"images/doll-white.webp",
    captionTitle:"задание 2",
    caption:"тема УЗКАЯ (которая интересна только подписчикам из вашей ниши)",
    captionPlace:"over",
    blocks:[
      { video:"" },
      { text:"Как вырезать объект и сделать из него стикер с белой обводкой за 2 минуты." },
      { file:"files/stickers.zip", name:"Готовые стикеры", size:"PNG · 24 шт." } ]},
  { title:"сочные визуалы", tag:"туториал", img:"images/lips-white.webp", blocks:[
      { steps:[
          { text:"Выбери один акцентный цвет на всю публикацию." },
          { text:"Добавь блеск: глянец и блики делают кадр «дорогим»." },
          { text:"Кадрируй ближе, чем кажется нужным." } ]} ]},
  { title:"королева охватов", tag:"лекция", img:"images/queen-white.webp", blocks:[
      { video:"" },
      { text:"Лекция о том, как алгоритмы решают, кому показать твой пост, и что с этим делать.\n\nВ конце — чек-лист перед публикацией." },
      { link:"https://example.com/checklist", name:"Чек-лист перед публикацией", note:"Notion" } ]},
  { title:"вишенка", tag:"идеи", img:"images/cherry-white.webp", blocks:[
      { text:"10 идей для постов в декабре, когда совсем нет вдохновения." },
      { steps:["Итоги года в 5 кадрах","Закулисье рабочего дня","Любимые инструменты","Ошибки, которые больше не повторю","Планы на январь"] } ]},
];
/* дни 9–28 — заглушки, пока не заполнены */
const IMGS = ["bun","ornament","disco","doll","lips","queen","cherry"];   // белые версии: images/<имя>-white.webp
while (DAYS.length < 28) {
  const k = DAYS.length;
  DAYS.push({ title:"скоро", tag:"сюрприз", img:`images/${IMGS[k % IMGS.length]}-white.webp`,
              blocks:[{ text:"Содержимое этого дня ещё готовится." }] });
}

const LOCK_FUTURE = false;               // true — будущие дни закрыты
/* ОТКРЫТ / В КЛУБЕ
   Схема повторяется по кругу: «з» — закрыт (размыт, «в клубе»), «о» — открыт (чёткий, нажимается).
   Сейчас: 1 закрыт, 3 открытых, 3 закрытых → дальше выходит «3 открытых, 4 закрытых».
   Схема нечётной длины (7) — поэтому открытые и закрытые попадают в обе колонки.
   Любой день можно переопределить вручную: open:true или open:false. */
const OPEN_PATTERN = "зоооззз";
const START = new Date(2026, 11, 1);     // 1 декабря

/* =========================================================
   РАСКЛАДКА: ряды по 2 дня — одна карточка крупная, другая маленькая,
   стороны чередуются. Повторяется каждые 6 рядов (12 дней).
   L / R   – ширина левой и правой карточки (доля ширины)
   dyL/dyR – насколько карточка опущена вниз (доля ширины крупной)
   ========================================================= */
const ROWS = [
  { L:.46, R:.30, dyL:0,   dyR:.42 },
  { L:.32, R:.58, dyL:.20, dyR:0   },
  { L:.46, R:.40, dyL:0,   dyR:.30 },
  { L:.28, R:.62, dyL:.36, dyR:0   },
  { L:.58, R:.34, dyL:0,   dyR:.24 },
  { L:.40, R:.48, dyL:.30, dyR:0   },
];
const MAX_W = 440;   // на широких экранах композиция не растягивается шире этого (px)
const WORDS = ["trends","creative","templates","ideas","visual","smm","marketing","tutorials","lessons","advent","gifts","inspo"];

/* ---------- Telegram: вибрация и облегчённый режим ---------- */
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== 'unknown');
// вибрация: impact — 'light' | 'medium' | 'soft' | …, notify — 'success' | 'warning' | 'error'
function haptic(kind, type){
  try {
    const h = IN_TG && TG.HapticFeedback;
    if (!h) return;
    kind === 'notify' ? h.notificationOccurred(type) : h.impactOccurred(type);
  } catch (_) {}
}
/* слабые Android: Telegram пишет класс устройства в конце User-Agent — (… ; LOW) / AVERAGE / HIGH.
   На LOW убираем покачивание и доворот, параллакс слабее, размытие легче. */
const LITE = /Telegram-Android\/[^(]*\([^)]*;\s*LOW\)/i.test(navigator.userAgent);
if (LITE) document.documentElement.classList.add('lite');

const field = document.getElementById('field');
const hero = document.querySelector('.intro');
const today = new Date();
const rnd = n => { const x = Math.sin(n * 99.13) * 43758.5453; return x - Math.floor(x); }; // стабильный «рандом»

const capText = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
DAYS.forEach((d, i) => {
  const row = ROWS[Math.floor(i / 2) % ROWS.length];
  const side = i % 2;                                          // 0 — слева, 1 — справа
  const size = side ? row.R : row.L;
  const big  = Math.max(row.L, row.R);
  const dy   = side ? row.dyR : row.dyL;
  const n = String(i + 1).padStart(2, '0');
  const date = new Date(START); date.setDate(START.getDate() + i);
  const open = d.open ?? (OPEN_PATTERN[i % OPEN_PATTERN.length] === 'о');
  const locked = !open || (LOCK_FUTURE && date > today);
  const depth = Math.min(1, Math.max(0, (size - .28) / (.62 - .28)));   // 0 = маленькая/далеко, 1 = крупная/близко
  const rot = (size === big ? 2 : 5) * (rnd(i+3) > .5 ? 1 : -1) * (.6 + rnd(i+5) * .4);

  const el = document.createElement('button');
  el.className = 'card' + (locked ? ' is-locked' : '');
  el.style.cssText = `--z:${1 + Math.round(depth*10)};` +
                     `--b:${locked ? (3 + (1-depth)*1.5).toFixed(1) : 0}px;--rin:${(rnd(i+7)-.5)*24}deg`;
  el.dataset.i = i;
  el.innerHTML = `
    <div class="plx"><div class="rev">
      <div class="label"><i class="num">((${n}))</i><span class="ttl">${d.title}</span></div>
      <div class="media">
        <div class="tilt"><img src="${d.img}" alt="День ${i+1}: ${d.title}"></div>
        ${d.caption && d.captionPlace === 'center' ? `<p class="cap cap-on">${capText(d.caption)}</p>` : ''}
        ${d.caption && d.captionPlace === 'over' ? `<div class="cap-over">${d.captionTitle ? `<b>${capText(d.captionTitle)}</b>` : ''}<p>${capText(d.caption)}</p></div>` : ''}
      </div>
      ${d.caption && !d.captionPlace ? `<p class="cap">${capText(d.caption)}</p>` : ''}
    </div></div>`;
  el._m = { size, side, dy, big, depth, rot,
            imgScale: /cherry/.test(d.img) ? .66 : 1,      // вишни помельче
            speed: (.03 + depth * .04) * (LITE ? .5 : 1),    // крупные едут чуть быстрее (разница мала — меньше наездов)
            sway:  LITE ? 0 : (side ? 1 : -1) * (2 + depth * 2),        // покачивание влево-вправо
            spin:  LITE ? 0 : (i % 3 ? 1 : -1) * (2 + (1-depth) * 4),   // доворот при прокрутке
            r: rot, x:0, y:0 };
  field.appendChild(el);
});
const cards = [...field.querySelectorAll('.card')];

const words = WORDS.map((t, i) => {
  const w = document.createElement('span');
  w.className = 'word'; w.textContent = t; w.setAttribute('aria-hidden','true');
  w.style.setProperty('--fs', (11 + rnd(i+40) * 9).toFixed(0) + 'px');
  w._m = { speed: -.03 - rnd(i+50) * .05, sway: 0, spin: 0, r: 0, x:0, y:0 };   // плывут вверх чуть быстрее страницы
  field.appendChild(w);
  return w;
});

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let smooth = scrollY, running = false;

/* раскладываем по рядам */
function layout(){
  const W = field.clientWidth;
  const B = Math.min(W, MAX_W);                       // ширина композиции
  const off = (W - B) / 2;                            // по центру на широком экране
  const pad = 6;
  const placed = [];
  let rowTop = 0;
  for (let r = 0; r < cards.length; r += 2){
    let rowBottom = rowTop;
    for (const c of cards.slice(r, r + 2)){
      const m = c._m;
      const img = c.querySelector('img');
      const ar = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1;
      const w = B * m.size * m.imgScale * Math.max(.7, Math.min(1, 1.2 / ar));   // высокие картинки чуть уже, чтобы не тянулись вниз
      c.style.width = w + 'px';
      const h = c.offsetHeight || w;
      const jitter = rnd(+c.dataset.i + 11) * B * .04;
      const x = off + (m.side ? B - w - pad - jitter : pad + jitter);
      const y = rowTop + m.dy * B * m.big;
      m.x = x; m.y = y;
      c.style.left = x + 'px'; c.style.top = y + 'px';
      placed.push({ x, y, w, h });
      rowBottom = Math.max(rowBottom, y + h);
    }
    rowTop = rowBottom + 34;                          // зазор между рядами
  }
  const bottom = Math.max(...placed.map(p => p.y + p.h));
  // запас внизу, чтобы последние ряды доезжали до середины экрана и тоже двигались
  field.style.height = bottom + Math.max(140, innerHeight * .3) + 'px';

  /* слова встают только в пустые места: ищем точку, где рядом нет ни одной картинки */
  const M = 32;                                       // отступ от картинок
  const taken = [];                                   // уже поставленные слова — их тоже обходим
  const free = (x, y, ww, wh) =>
    !placed.some(p => x < p.x + p.w + 10 && x + ww > p.x - 10 && y < p.y + p.h + M && y + wh > p.y - M) &&
    !taken.some(t => Math.abs(t.y - y) < 120);
  words.forEach((w, i) => {
    const ww = w.offsetWidth || 80, wh = w.offsetHeight || 18;
    const maxY = bottom - innerHeight * .2;           // не в самом конце страницы
    let y0 = (i + .5) / words.length * maxY, spot = null;
    for (let dy = 0; dy < 900 && !spot; dy += 16)
      for (const sy of [y0 + dy, y0 - dy]) {
        if (sy < 0 || sy > maxY) continue;
        const start = rnd(i+60);
        for (let k = 0; k < 12 && !spot; k++) {
          const x = off + ((start + k / 12) % 1) * (B - ww);
          if (free(x, sy, ww, wh)) spot = { x, y: sy };
        }
        if (spot) break;
      }
    w.hidden = !spot;                                 // некуда поставить — не показываем
    if (!spot) return;
    taken.push(spot);
    w._m.x = spot.x; w._m.y = spot.y;
    w.style.left = spot.x + 'px'; w.style.top = spot.y + 'px';
  });
  kick();
}
cards.forEach(c => c.querySelector('img').addEventListener('load', layout));
addEventListener('resize', layout);
layout();

/* появление при прокрутке */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { rootMargin: '0px 0px -8% 0px' });
cards.forEach(c => io.observe(c));

/* ---------- движение при прокрутке ----------
   плавный скролл с инерцией: картинки чуть «догоняют» палец */
function frame(){
  const vh = innerHeight;
  smooth += (scrollY - smooth) * (LITE ? .35 : .11);   // на слабых устройствах без долгой инерции
  const fieldTop = field.getBoundingClientRect().top + scrollY;
  let moving = Math.abs(scrollY - smooth) > .3;

  for (const el of [...cards, ...words]){
    const m = el._m;
    const docY = fieldTop + m.y + (el.offsetHeight || 0) / 2;
    const p = (docY - (smooth + vh/2)) / vh;              // -1 … 1 относительно центра экрана
    if (p < -1.6 || p > 1.6) continue;
    const isActive = el.classList.contains('is-active');
    const targetR = isActive ? 0 : m.rot || 0;            // при нажатии карточка выпрямляется
    m.r += (targetR - m.r) * .14;
    if (Math.abs(targetR - m.r) > .05) moving = true;
    const ty = -p * vh * m.speed;
    const tx = Math.sin(p * 2.2 + m.y * .01) * m.sway;
    const rot = m.r + p * m.spin * (isActive ? 0 : 1);
    m.cur = rot;                                          // запоминаем наклон — нужен для попадания пальцем
    const sc  = 1 + (1 - Math.min(1, Math.abs(p))) * .05 * (m.speed > 0 ? 1 : 0);
    if (el.classList.contains('card'))
      el.firstElementChild.style.transform = `translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    else
      el.style.transform = `translate3d(0,${ty.toFixed(1)}px,0)`;
  }
  // заголовок уезжает медленнее и тает
  const hp = Math.min(1, smooth / (vh * .4));        // к середине первого экрана вступление уже растаяло
  hero.style.transform = `translate3d(0,${(smooth * .2).toFixed(1)}px,0) scale(${(1 - hp*.06).toFixed(3)})`;
  hero.style.opacity = (1 - hp).toFixed(3);

  if (moving && !reduce) requestAnimationFrame(frame); else running = false;
}
function kick(){ if (reduce) { smooth = scrollY; frame(); return; } if (!running){ running = true; requestAnimationFrame(frame); } }
addEventListener('scroll', kick, { passive:true });

/* ---------- наклон по пальцу + проявление ---------- */
const TILT = +getComputedStyle(document.documentElement).getPropertyValue('--tilt');
let active = null;

function tiltTo(card, clientX, clientY){
  const t = card.querySelector('.tilt');
  const r = t.getBoundingClientRect();
  let px = Math.min(Math.max((clientX - r.left)/r.width, 0), 1) - .5;   // -0.5…0.5
  let py = Math.min(Math.max((clientY - r.top)/r.height, 0), 1) - .5;
  // нажали почти в центр — всё равно заметно наклоняем, иначе эффекта не видно
  const mag = Math.hypot(px, py), MIN = .32;
  if (mag < .03) { px = -.26; py = -.18; }
  else if (mag < MIN) { px *= MIN / mag; py *= MIN / mag; }
  // карточка «вдавливается» в точку касания — как наведение курсором в референсе
  t.style.transform = `perspective(700px) rotateY(${(px*TILT*2).toFixed(2)}deg) rotateX(${(-py*TILT*2).toFixed(2)}deg) scale(1.14)`;
}
function activate(card){
  if (active && active !== card) deactivate(active);
  active = card;
  card.classList.add('is-active');
  document.body.classList.add('focus');            // остальные карточки приглушаются — «прожектор»
  kick();
}
function deactivate(card){
  card.classList.remove('is-active');
  card.querySelector('.tilt').style.transform = '';
  if (active === card) active = null;
  if (!active) document.body.classList.remove('focus');
  kick();
}

const OPEN_DELAY = 1300;   // сколько мс показываем эффект до открытия дня
let openTimer, driftTimer;

/* --- какая карточка под пальцем ---
   картинки вырезаны, вокруг объекта прозрачно. Чтобы прозрачный угол передней карточки
   не «съедал» нажатие по задней, проверяем, попал ли палец в непрозрачный пиксель. */
const alphaCache = new Map();
function alphaMap(img){
  if (!img.naturalWidth) return null;
  let a = alphaCache.get(img.src);
  if (a) return a;
  const k = Math.min(1, 96 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(img.naturalWidth * k));
  cv.height = Math.max(1, Math.round(img.naturalHeight * k));
  const cx = cv.getContext('2d', { willReadFrequently: true });
  try {
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    a = { w: cv.width, h: cv.height, d: cx.getImageData(0, 0, cv.width, cv.height).data };
  } catch (e) { a = { none: true }; }        // если браузер не дал прочитать — считаем всю картинку «плотной»
  alphaCache.set(img.src, a);
  return a;
}
function solidAt(card, x, y){
  const img = card.querySelector('img');
  const r = img.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const ang = -(card._m.cur || 0) * Math.PI / 180;           // снимаем наклон карточки
  const dx = x - cx, dy = y - cy;
  const lx = dx * Math.cos(ang) - dy * Math.sin(ang);
  const ly = dx * Math.sin(ang) + dy * Math.cos(ang);
  const w = img.offsetWidth, h = img.offsetHeight;
  const sc = r.width / Math.max(1, Math.abs(w * Math.cos(ang)) + Math.abs(h * Math.sin(ang)));
  const u = lx / (w * sc) + .5, v = ly / (h * sc) + .5;
  if (u < 0 || u > 1 || v < 0 || v > 1) return false;
  const a = alphaMap(img);
  if (!a || a.none) return true;
  const px = Math.floor(u * a.w), py = Math.floor(v * a.h);
  for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {   // небольшой допуск вокруг пальца
    const X = px + ox, Y = py + oy;
    if (X < 0 || Y < 0 || X >= a.w || Y >= a.h) continue;
    if (a.d[(Y * a.w + X) * 4 + 3] > 60) return true;
  }
  return false;
}
function pickCard(x, y){
  const under = cards.filter(c => {
    const r = c.querySelector('img').getBoundingClientRect();
    return x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6;
  });
  if (!under.length) return null;
  // сверху вниз: та, что выше по слою, проверяется первой
  under.sort((A, B) => (+getComputedStyle(B).zIndex || 0) - (+getComputedStyle(A).zIndex || 0)
                       || (+B.dataset.i) - (+A.dataset.i));
  const hit = under.find(c => solidAt(c, x, y));
  if (hit) return hit;
  // палец в пустом месте — берём карточку, к центру которой он ближе
  const dist = c => { const r = c.querySelector('img').getBoundingClientRect();
                      return Math.hypot(x - (r.left + r.width/2), y - (r.top + r.height/2)); };
  return under.sort((A, B) => dist(A) - dist(B))[0];
}

/* --- свой «тап» вместо click: на iPhone click часто теряется, потому что карточка
       начинает двигаться под пальцем. Тап = коснулся и отпустил, почти не сдвигая палец. */
let press = null;
const TAP_MOVE = 14;   // px — больше считается прокруткой

/* общие шаги жеста — для пальца (touch-события) и для мыши (pointer-события) */
function tapStart(x, y, id){
  if (document.body.classList.contains('open')) return;
  const card = pickCard(x, y);
  if (!card) return;
  press = { card, id, x, y, locked: card.classList.contains('is-locked') };
  if (press.locked) return;                         // закрытый — реагируем только на отпускание
  haptic('impact', 'light');                        // палец коснулся открытого урока
  clearTimeout(openTimer); clearTimeout(driftTimer);
  activate(card);
  tiltTo(card, x, y);
}
function tapMove(x, y, id){
  if (!press || id !== press.id) return;
  if (Math.hypot(x - press.x, y - press.y) > TAP_MOVE) { tapCancel(id); return; }
  if (!press.locked) tiltTo(press.card, x, y);
}
function tapEnd(id){
  if (!press || id !== press.id) return;
  const { card, locked } = press; press = null;
  locked ? lockedTap(card) : openCard(card);
}
function tapCancel(id){
  if (!press || id !== press.id) return;
  if (!press.locked) deactivate(press.card);
  press = null;
}

// палец: touch-события на iPhone надёжнее pointer-событий (не обрываются от лёгкого дрожания)
field.addEventListener('touchstart', e => {
  if (e.touches.length > 1) { if (press) tapCancel(press.id); return; }
  const t = e.changedTouches[0]; tapStart(t.clientX, t.clientY, 't' + t.identifier);
}, { passive: true });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches) tapMove(t.clientX, t.clientY, 't' + t.identifier);
}, { passive: true });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) tapEnd('t' + t.identifier);
});
addEventListener('touchcancel', e => {               // палец ушёл в прокрутку — гасим
  for (const t of e.changedTouches) tapCancel('t' + t.identifier);
});

// мышь и стилус
field.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button > 0) return;
  tapStart(e.clientX, e.clientY, 'p' + e.pointerId);
});
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') tapMove(e.clientX, e.clientY, 'p' + e.pointerId); });
addEventListener('pointerup',   e => { if (e.pointerType !== 'touch') tapEnd('p' + e.pointerId); });
addEventListener('pointercancel', e => { if (e.pointerType !== 'touch') tapCancel('p' + e.pointerId); });

/* нажали на закрытый день — покачиваем карточку и подсказываем про клуб */
let toastTimer;
function lockedTap(card){
  haptic('notify', 'warning');                      // «это в клубе»
  card.classList.remove('nudge'); void card.offsetWidth; card.classList.add('nudge');
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  const club = document.querySelector('.club');
  club.classList.remove('pulse'); void club.offsetWidth; club.classList.add('pulse');
}

function openCard(card){
  activate(card);
  clearTimeout(openTimer); clearTimeout(driftTimer);
  // карточка плавно «покачивается» в другую сторону, чтобы эффект было видно
  const t = card.querySelector('.tilt');
  const m = /rotateY\(([-\d.]+)deg\) rotateX\(([-\d.]+)deg\)/.exec(t.style.transform);
  if (m) driftTimer = setTimeout(() => {
    t.style.transform = `perspective(700px) rotateY(${(-m[1]*.45).toFixed(2)}deg) rotateX(${(-m[2]*.45).toFixed(2)}deg) scale(1.18)`;
  }, 550);
  // даём эффекту отыграть, потом открываем день
  openTimer = setTimeout(() => { haptic('impact', 'medium'); openDay(+card.dataset.i); }, OPEN_DELAY);
}

// клавиатура (Enter/пробел на карточке): нажатие пальцем/мышью уже обработано выше
cards.forEach(card => card.addEventListener('click', e => {
  if (e.detail !== 0 || card.classList.contains('is-locked')) return;
  activate(card);
  card.querySelector('.tilt').style.transform = `perspective(700px) rotateX(8deg) rotateY(-12deg) scale(1.14)`;
  openCard(card);
}));

/* фокус возвращаем только тем, кто управляет с клавиатуры — иначе iPhone рисует синюю рамку */
let usingKeyboard = false;
addEventListener('keydown', e => { if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ') usingKeyboard = true; }, true);
['touchstart','pointerdown'].forEach(t => addEventListener(t, () => { usingKeyboard = false; }, { capture: true, passive: true }));

/* ---------- шторка ---------- */
const sheet = document.getElementById("sheet"), closeBtn = document.getElementById("closeBtn");
function videoHTML(src){
  if (!src) return `<div class="video"><div class="ph">здесь будет видео</div></div>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(src))
    return `<div class="video"><video src="${src}" controls playsinline preload="metadata"></video></div>`;
  return `<div class="video"><iframe src="${src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function blockHTML(b){
  if ('video' in b)  return videoHTML(b.video);
  if (b.heading)     return `<h3>${esc(b.heading)}</h3>`;
  if (b.text)        return b.text.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
  if (b.steps)       return `<ol class="steps">${b.steps.map(s => {
                        const o = typeof s === 'string' ? {text:s} : s;
                        return `<li>${esc(o.text)}${o.img ? `<img src="${esc(o.img)}" alt="" loading="lazy">` : ''}</li>`;
                      }).join('')}</ol>`;
  if (b.file)        return `<a class="row" href="${esc(b.file)}" download>
                        <span class="ic" aria-hidden="true">↓</span>
                        <span class="tx"><b>${esc(b.name || 'Скачать файл')}</b><small>${esc(b.size || '')}</small></span></a>`;
  if (b.link)        return `<a class="row" href="${esc(b.link)}" target="_blank" rel="noopener">
                        <span class="ic" aria-hidden="true">↗</span>
                        <span class="tx"><b>${esc(b.name || b.link)}</b><small>${esc(b.note || new URL(b.link).hostname)}</small></span>
                        <span class="go" aria-hidden="true">›</span></a>`;
  return '';
}
function openDay(i){
  const d = DAYS[i];
  const date = new Date(START); date.setDate(START.getDate() + i);
  sNum.textContent = `((${String(i+1).padStart(2,'0')})) день`;
  sDate.textContent = date.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  sTag.textContent = d.tag || '';
  sTag.hidden = !d.tag;
  sTitle.textContent = d.title;
  sImg.src = d.img; sImg.alt = d.title;
  sBody.innerHTML = (d.blocks || []).map(blockHTML).join('');
  sheet.scrollTop = 0;
  document.body.classList.add('open','locked');
  if (usingKeyboard) closeBtn.focus({preventScroll:true});
}
function closeDay(){
  document.body.classList.remove('open','locked');
  sBody.innerHTML = '';                 // останавливает видео
  if (active) { const c = active; deactivate(c); if (usingKeyboard) c.focus({preventScroll:true}); else c.blur(); }
}
closeBtn.onclick = closeDay;
scrim.onclick = closeDay;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDay(); });

/* свайп шторки вниз = закрыть */
let sy = null;
sheet.addEventListener('touchstart', e => { sy = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if (sy === null) return;
  const dy = e.touches[0].clientY - sy;
  if (dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
}, {passive:true});
sheet.addEventListener('touchend', e => {
  if (sy === null) return;
  const dy = e.changedTouches[0].clientY - sy;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 110) closeDay();
  sy = null;
});
</script>
<script>
/* внутри Telegram-бота: раскрыть на весь экран и не закрывать приложение свайпом вниз при прокрутке */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData && !tg.platform || tg.platform === 'unknown') return;
  try {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
    tg.setHeaderColor && tg.setHeaderColor('#550d10');
    tg.setBackgroundColor && tg.setBackgroundColor('#550d10');
    tg.setBottomBarColor && tg.setBottomBarColor('#550d10');   // нижняя полоса Telegram в цвет фона
  } catch(e) {}
})();
</script>
