<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Advent Calendar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#b0c0d0;          /* голубо-серый фон из макета */
    --dark:#121417;        /* заголовок и большая звезда */
    --grey:#58626e;        /* даты, названия, текст закрытых дней */
    --white:#ffffff;       /* шапка, подзаголовок, текст открытых дней, снежинки */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--dark)}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body.locked{overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0}

  /* ---------- закреплённая верхняя часть: шапка + заголовок + звезда ---------- */
  .top{
    position:fixed;top:0;left:0;right:0;z-index:20;
    background:var(--bg);
    padding-top:env(safe-area-inset-top,0px);
  }
  .top-in{position:relative;max-width:560px;margin:0 auto}
  .head{
    position:relative;height:calc(var(--t) * 22);
    font-size:clamp(7.5px,calc(var(--t) * 6.6),12px);line-height:1;letter-spacing:-.01em;white-space:nowrap;
    color:var(--white);
  }
  .head span{position:absolute;top:calc(var(--t) * 9)}
  .head span:nth-child(1){left:5%}
  .head span:nth-child(2){left:31.5%}
  .head span:nth-child(3){left:48%}
  .head span:nth-child(4){right:5%}

  /* узкий высокий гротеск: обычный Helvetica, вытянутый по вертикали */
  .hero{
    position:relative;z-index:1;
    padding:calc(var(--t) * 26) 0 0 4%;
    font-weight:400;font-size:40px;   /* точный размер подгоняет fitTop() */
    letter-spacing:-.035em;line-height:.8;color:var(--dark);
  }
  .hero span{display:block;width:max-content;padding-top:.42em;transform:scaleY(1.55);transform-origin:0 100%;white-space:nowrap}
  .hero .ind{padding-left:.58em}
  .tagline{
    margin:calc(var(--t) * 8) 0 0 var(--tag-x,44%);
    padding-bottom:calc(var(--t) * 14);
    font-size:14px;letter-spacing:-.025em;line-height:.82;color:var(--white);
  }
  .tagline span{display:block;width:max-content;padding-top:.3em;transform:scaleY(1.4);transform-origin:0 100%;white-space:nowrap}
  .star{
    position:absolute;z-index:0;
    left:calc(var(--u) * 338 - var(--t) * 102);top:calc(var(--t) * 24);
    width:calc(var(--t) * 88);height:calc(var(--t) * 88);
    color:var(--dark);
  }

  /* ---------- лента дней ---------- */
  .list{
    position:relative;max-width:560px;margin:0 auto;
    padding-top:var(--top-h,300px);
    padding-bottom:calc(52px + 20px + env(safe-area-inset-bottom,0px));
  }
  .day{
    position:relative;display:flex;align-items:flex-start;
    opacity:0;transform:translateY(18px);
    transition:opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .day.in{opacity:1;transform:none}
  /* текст слева, прижат вправо к фото */
  .txt{
    flex:none;width:43%;padding-left:14%;padding-right:calc(var(--u) * 6);padding-top:calc(var(--u) * 2);
    text-align:right;color:var(--grey);letter-spacing:-.02em;
    transform:scaleY(1.28);transform-origin:100% 0;
  }
  .txt .date{font-size:clamp(8px,calc(var(--u) * 7.6),13px);line-height:.95}
  .txt .ttl{display:block;white-space:pre-line;margin-top:calc(var(--u) * 13);font-size:clamp(8.5px,calc(var(--u) * 8.4),14px);line-height:.9;text-transform:uppercase}
  .txt .desc{display:block;white-space:pre-line;font-size:clamp(8.5px,calc(var(--u) * 8.4),14px);line-height:.92}
  .day.is-open .txt{color:var(--white)}

  .ph{
    position:relative;flex:none;display:block;cursor:pointer;margin-left:1.8%;
    outline:none;-webkit-tap-highlight-color:transparent;
    transition:transform .25s ease;
  }
  .ph:focus-visible{outline:1px dashed var(--dark);outline-offset:3px}
  .ph img{display:block;width:100%;height:auto}
  .ph:active{transform:scale(.985)}
  /* замок на закрытых днях */
  .lock{
    position:absolute;left:0;right:0;top:var(--ly,42%);
    display:flex;flex-direction:column;align-items:center;gap:calc(var(--u) * 4);
    color:var(--white);text-align:center;pointer-events:none;
    filter:drop-shadow(0 0 3px rgba(0,0,0,.35));
  }
  .lock svg{width:calc(var(--u) * 22);height:calc(var(--u) * 26)}
  .lock span{font-size:clamp(8px,calc(var(--u) * 7.2),12px);line-height:.95;letter-spacing:-.02em;transform:scaleY(1.25)}
  .day.nudge .ph{animation:nudge .45s ease}
  @keyframes nudge{20%{transform:translateX(-6px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}}

  /* снежинки */
  .flake{position:absolute;z-index:2;pointer-events:none;color:var(--white);
    animation:twinkle 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes twinkle{0%,100%{opacity:.95;transform:rotate(0) scale(1)}50%{opacity:.55;transform:rotate(12deg) scale(.9)}}

  .toast{
    position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:36;
    transform:translate(-50%,10px);opacity:0;pointer-events:none;
    padding:9px 16px;border-radius:999px;background:rgba(18,20,23,.7);color:var(--white);
    font-size:13px;white-space:nowrap;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- кнопка клуба: белая полоса во всю ширину ---------- */
  .club{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:var(--white);
    padding-bottom:env(safe-area-inset-bottom,0px);
    transition:transform .3s ease;
  }
  .club a{
    display:flex;align-items:center;justify-content:center;height:52px;
    color:var(--dark);text-decoration:none;font-size:17px;letter-spacing:-.03em;
  }
  .club a span{display:inline-block;transform:scaleY(1.35)}
  .club a:active span{opacity:.6}
  .club.pulse a span{animation:pulse .9s ease}
  @keyframes pulse{30%{transform:scaleY(1.35) scale(1.08)}60%{transform:scaleY(1.35) scale(.98)}}
  .open .club{transform:translateY(110%)}

  /* ---------- шторка с содержимым дня ---------- */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(18,20,23,.4);opacity:0;pointer-events:none;transition:opacity .35s ease}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
    --paper:#f4f2ee;--ink:#121417;--muted:rgba(18,20,23,.55);--line:rgba(18,20,23,.14);
    --surface:rgba(18,20,23,.06);--surface-press:rgba(18,20,23,.11);
    background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;
    padding:10px 16px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .open .scrim{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px;padding-right:44px}
  .sheet h2{font-size:30px;line-height:1;letter-spacing:-.03em;font-weight:400;text-transform:uppercase;margin-bottom:14px}
  .sheet .cover{width:100%;max-height:300px;object-fit:cover;display:block;margin:0 0 18px}
  .sheet p{font-size:15px;line-height:1.5;margin-bottom:14px}
  .sheet h3{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
  .tag{display:inline-block;font-size:12px;letter-spacing:.02em;margin-bottom:10px}
  .tag::before{content:"//"}
  .steps{list-style:none;counter-reset:s;margin-bottom:14px}
  .steps li{counter-increment:s;position:relative;padding:12px 0 12px 40px;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
  .steps li:last-child{border-bottom:1px solid var(--line)}
  .steps li::before{content:"(" counter(s,decimal-leading-zero) ")";position:absolute;left:0;top:13px;font-size:11px;font-style:italic;color:var(--muted)}
  .steps img{display:block;width:100%;margin-top:10px}
  .row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;margin-bottom:8px;border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none}
  .row:active{background:var(--surface-press)}
  .row .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:15px}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-weight:500;font-size:14px;line-height:1.25}
  .row .tx small{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .go{flex:none;font-size:16px;color:var(--muted)}
  .video{position:relative;aspect-ratio:16/9;background:rgba(18,20,23,.08);margin:6px 0 16px;overflow:hidden}
  .video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video .vph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .close{
    position:sticky;top:0;float:right;margin-top:-4px;
    background:var(--ink);color:var(--paper);
    width:32px;height:32px;border-radius:50%;font-size:16px;line-height:32px;cursor:pointer;
    outline:none;-webkit-tap-highlight-color:transparent;
  }
  .close:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .day,.sheet,.flake{transition:none;animation:none}
    .day{opacity:1;transform:none}
  }
</style>
</head>
<body>

<!-- закреплено сверху, не прокручивается -->
<div class="top" id="top">
  <div class="top-in">
    <header class="head">
      <span>ne(w) content dump</span>
      <span>2027</span>
      <span>content advent calendar</span>
      <span>by dasha.brisaniuk</span>
    </header>
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.1">
      <line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="16" y1="16" x2="84" y2="84"/><line x1="84" y1="16" x2="16" y2="84"/>
    </svg>
    <h1 class="hero">
      <span class="ind">new</span>
      <span>((content advent))</span>
      <span class="ind">calendar</span>
    </h1>
    <p class="tagline">
      <span>заходим в 2027</span>
      <span>не с обещаниями, а с готовым</span>
      <span>контентом, который нативно</span>
      <span>продаёт</span>
    </p>
  </div>
</div>

<!-- прокручивается только это -->
<main class="list" id="list"></main>

<div class="toast" id="toast" role="status">материал доступен только в клубе</div>
<nav class="club" id="club"><a id="clubBtn" href="https://t.me/newcontentdump_bot?start=" target="_blank" rel="noopener"><span>зайти в клуб</span></a></nav>

<div class="scrim" id="scrim"></div>
<article class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="grab"></div>
  <button class="close" id="closeBtn" aria-label="Закрыть">✕</button>
  <div class="meta"><span id="sNum"></span><span id="sDate"></span></div>
  <span class="tag" id="sTag"></span>
  <h2 id="sTitle"></h2>
  <img id="sImg" class="cover" alt="">
  <div id="sBody"></div>
</article>

<script>
/* =========================================================
   ДАННЫЕ: один объект = один день (сверху вниз).
   title  – название (заглавными в ленте)
   desc   – короткое описание под названием
   img    – фото дня
   open   – true = урок открыт (фото шире, до края экрана, текст описания белый)
            false = «в клубе»: замок + «((материал доступен только в клубе))»
   w      – ширина фото в долях экрана (необязательно)
   tag, blocks – содержимое шторки для открытых дней:
     { text:"абзац" } { video:"https://…/embed/…" | "x.mp4" | "" } { steps:["…","…"] }
     { file:"files/x.pdf", name:"…", size:"…" } { link:"https://…", name:"…", note:"…" } { heading:"…" }
   ========================================================= */
const START = new Date(2026, 10, 30);   // первый день — 30 ноября 2026 (пн.)
const DAYS = [
  { title:"задание ((1))", desc:"создаём рилс на охват используя боли твоих подписчиков",
    img:"images/day1.webp", open:false, w:.405, ly:"40%" },
  { title:"лекция\n«боли твоих\nклиентов»", desc:"лекция о том, как нативно подсвечивать боли ваших клиентов которые вы закрываете услугой",
    img:"images/day2.webp", open:true, w:.555, tag:"лекция", blocks:[
      { video:"" },
      { text:"Лекция о том, как нативно подсвечивать боли ваших клиентов, которые вы закрываете своей услугой." } ]},
  { title:"проверка\nсценариев", desc:"в чате\nклуба",
    img:"images/day3.webp", open:false, w:.405, ly:"46%" },
  { title:"подборка\nидей для съёмки\nрилсов", desc:"примеры того, как снимать говорящую голову",
    img:"images/day4.webp", open:true, w:.54, tag:"подборка", blocks:[
      { text:"Примеры того, как снимать говорящую голову, чтобы видео досматривали." },
      { video:"" } ]},
  { title:"подборка\nсубтитров", desc:"варианты шрифтовых композиций для субтитров",
    img:"images/day5.webp", open:false, w:.40, ly:"26%" },
];
/* снежинки: x, y и размер в единицах макета (ширина экрана = 338), y — от начала ленты */
const FLAKES = [[33,34,40],[312,120,42],[67,307,40],[310,465,40],[120,602,40]];
</script>
<script>
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== 'unknown');
function haptic(kind, type){
  try { const h = IN_TG && TG.HapticFeedback; if (!h) return;
    kind === 'notify' ? h.notificationOccurred(type) : h.impactOccurred(type); } catch(_){}
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD = ['вс.','пн.','вт.','ср.','чт.','пт.','сб.'];
const dateOf = i => { const d = new Date(START); d.setDate(START.getDate() + i); return d; };

const LOCK_SVG = `<svg viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
  <path d="M5 11V7a6 6 0 0 1 12 0v4"/><rect x="1.5" y="11" width="19" height="13.5" rx="1.5"/>
  <circle cx="11" cy="16.5" r="1.6" fill="currentColor" stroke="none"/><path d="M11 17.5v3"/></svg>`;
const FLAKE_SVG = `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
  <defs><radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".85">
    <line x1="50" y1="2" x2="50" y2="98"/><line x1="2" y1="50" x2="98" y2="50"/>
    <line x1="18" y1="18" x2="82" y2="82"/><line x1="82" y1="18" x2="18" y2="82"/></g>
  <circle cx="50" cy="50" r="9" fill="url(#glow)"/><circle cx="50" cy="50" r="2.6" fill="#fff"/></svg>`;

const list = document.getElementById('list');
list.innerHTML = DAYS.map((d, i) => {
  const dt = dateOf(i);
  const dd = String(dt.getDate()).padStart(2,'0') + '.' + String(dt.getMonth()+1).padStart(2,'0');
  return `<section class="day ${d.open ? 'is-open' : 'is-locked'}" data-i="${i}">
    <div class="txt">
      <div class="date">((${dd}))<br>${WD[dt.getDay()]}</div>
      <span class="ttl">${esc(d.title)}</span>
      <span class="desc">${esc(d.desc)}</span>
    </div>
    <button class="ph" style="width:${(d.w || .405) * 100}%" aria-label="${esc(d.title)}${d.open ? '' : ' — доступно в клубе'}">
      <img src="${esc(d.img)}" alt="" ${i > 1 ? 'loading="lazy"' : ''}>
      ${d.open ? '' : `<span class="lock" style="--ly:${d.ly || '42%'}">${LOCK_SVG}<span>((материал доступен<br>только в клубе))</span></span>`}
    </button>
  </section>`;
}).join('') + FLAKES.map(([x, y, s], k) =>
  `<span class="flake" style="left:calc(var(--u) * ${x - s/2});top:calc(var(--top-h) + var(--u) * ${y - s/2});width:calc(var(--u) * ${s});height:calc(var(--u) * ${s});--d:${-k * 1.3}s">${FLAKE_SVG}</span>`
).join('');

/* всё в ленте и шапке масштабируется от ширины, как в макете (338 px) */
function fitTop(){
  const W = Math.min(innerWidth, 560);
  const u = W / 338;
  const root = document.documentElement.style;
  root.setProperty('--u', u + 'px');
  const topEl = document.getElementById('top'), top = document.querySelector('.top-in');
  const hero = document.querySelector('.hero'), tag = document.querySelector('.tagline');
  const lines = [...hero.querySelectorAll('span')], tl = [...tag.querySelectorAll('span')];
  hero.style.fontSize = '40px';
  const w0 = Math.max(...lines.map(l => l.offsetWidth));
  const full = 40 * W * .68 / w0;                    // «((content advent))» ≈ 68% ширины
  const TARGET = innerHeight / 3;                     // закреплённая часть — треть экрана
  const place = k => {
    root.setProperty('--t', (u * k) + 'px');
    hero.style.fontSize = (full * k) + 'px';
    // подзаголовок начинается у конца «r» в calendar
    const x = lines[2].getBoundingClientRect().right - top.getBoundingClientRect().left;
    top.style.setProperty('--tag-x', x + 'px');
    tag.style.fontSize = '14px';
    const tw = Math.max(...tl.map(l => l.offsetWidth));
    tag.style.fontSize = Math.max(9, Math.min(20 * k, 14 * (W * .95 - x) / tw)) + 'px';
    return topEl.offsetHeight;
  };
  let k = 1;
  for (let n = 0; n < 4; n++) {
    const h = place(k);
    if (h <= TARGET + 1) break;
    k = Math.max(.45, k * TARGET / h);
  }
  root.setProperty('--top-h', place(k) + 'px');
}
fitTop();
addEventListener('resize', fitTop);
document.fonts && document.fonts.ready.then(fitTop);

/* плавное появление при прокрутке */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), { rootMargin:'0px 0px -8% 0px' });
document.querySelectorAll('.day').forEach(d => io.observe(d));

/* нажатия */
let toastT;
function lockedTap(day){
  haptic('notify','warning');
  day.classList.remove('nudge'); void day.offsetWidth; day.classList.add('nudge');
  const t = document.getElementById('toast');
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  const club = document.getElementById('club');
  club.classList.remove('pulse'); void club.offsetWidth; club.classList.add('pulse');
}
list.addEventListener('click', e => {
  const ph = e.target.closest('.ph'); if (!ph) return;
  const day = ph.closest('.day'), i = +day.dataset.i;
  if (day.classList.contains('is-locked')) return lockedTap(day);
  haptic('impact','medium');
  openDay(i);
});

/* шторка */
const sheet = document.getElementById('sheet'), closeBtn = document.getElementById('closeBtn');
function videoHTML(src){
  if (!src) return `<div class="video"><div class="vph">здесь будет видео</div></div>`;
  if (/\.(mp4|webm|mov)(\?|$)/i.test(src)) return `<div class="video"><video src="${esc(src)}" controls playsinline preload="metadata"></video></div>`;
  return `<div class="video"><iframe src="${esc(src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}
function blockHTML(b){
  if ('video' in b) return videoHTML(b.video);
  if (b.heading)    return `<h3>${esc(b.heading)}</h3>`;
  if (b.text)       return b.text.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
  if (b.steps)      return `<ol class="steps">${b.steps.map(s => { const o = typeof s === 'string' ? {text:s} : s;
                       return `<li>${esc(o.text)}${o.img ? `<img src="${esc(o.img)}" alt="" loading="lazy">` : ''}</li>`; }).join('')}</ol>`;
  if (b.file)       return `<a class="row" href="${esc(b.file)}" download><span class="ic" aria-hidden="true">↓</span>
                       <span class="tx"><b>${esc(b.name || 'Скачать файл')}</b><small>${esc(b.size || '')}</small></span></a>`;
  if (b.link)       return `<a class="row" href="${esc(b.link)}" target="_blank" rel="noopener"><span class="ic" aria-hidden="true">↗</span>
                       <span class="tx"><b>${esc(b.name || b.link)}</b><small>${esc(b.note || new URL(b.link).hostname)}</small></span><span class="go" aria-hidden="true">›</span></a>`;
  return '';
}
let lastPh = null, usingKeyboard = false;
addEventListener('keydown', e => { if (e.key === 'Tab' || e.key === 'Enter' || e.key === ' ') usingKeyboard = true; if (e.key === 'Escape') closeDay(); });
addEventListener('pointerdown', () => usingKeyboard = false, true);
function openDay(i){
  const d = DAYS[i], dt = dateOf(i);
  lastPh = document.querySelector(`.day[data-i="${i}"] .ph`);
  sNum.textContent = `((${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')})) ${WD[dt.getDay()]}`;
  sDate.textContent = dt.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  sTag.textContent = d.tag || ''; sTag.hidden = !d.tag;
  sTitle.textContent = d.title.replace(/\n/g,' ');
  sImg.src = d.img; sImg.alt = '';
  sBody.innerHTML = (d.blocks || [{ text: d.desc }]).map(blockHTML).join('');
  sheet.scrollTop = 0;
  document.body.classList.add('open','locked');
  if (usingKeyboard) closeBtn.focus({preventScroll:true});
}
function closeDay(){
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open','locked');
  sBody.innerHTML = '';
  if (lastPh) usingKeyboard ? lastPh.focus({preventScroll:true}) : lastPh.blur();
}
closeBtn.onclick = closeDay;
scrim.onclick = closeDay;
let sy = null;
sheet.addEventListener('touchstart', e => { sy = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if (sy === null) return; const dy = e.touches[0].clientY - sy;
  if (dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; }
}, {passive:true});
sheet.addEventListener('touchend', e => {
  if (sy === null) return; const dy = e.changedTouches[0].clientY - sy;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (dy > 110) closeDay(); sy = null;
});
</script>
